<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приглашение на школу актива и награждение</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --accent2: #a78bfa;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --ok: #22c55e;
    --no: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at top, #1e293b, #0f172a 70%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: fadeIn .8s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  h1 {
    font-size: 2rem;
    text-align: center;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 28px; font-size: .95rem; }

  .section { margin-bottom: 24px; }
  .section-title { font-size: .9rem; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .08em; }

  .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    flex: 1;
    min-width: 130px;
    padding: 14px 18px;
    border: 2px solid transparent;
    border-radius: 14px;
    background: #334155;
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
    transition: all .2s ease;
    font-weight: 600;
  }
  .btn:hover { transform: translateY(-2px); background: #475569; }
  .btn.selected.yes { background: var(--ok); border-color: #4ade80; }
  .btn.selected.no { background: var(--no); border-color: #f87171; }
  .btn.selected.day { background: var(--accent); border-color: #7dd3fc; color: #0f172a; }

  input[type="text"], textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: .95rem;
    font-family: inherit;
    transition: border .2s;
  }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }

  .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .checkbox-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: #334155;
    border-radius: 12px;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
    font-size: .95rem;
  }
  .checkbox-label:hover { background: #475569; }
  .checkbox-label input { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }
  .checkbox-label.checked { background: var(--accent2); color: #0f172a; font-weight: 600; }

  .hidden { display: none; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0f172a;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    margin-top: 8px;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(56,189,248,.3); }

  .success {
    text-align: center;
    padding: 20px 0;
    animation: fadeIn .5s ease;
  }
  .success .icon { font-size: 3rem; margin-bottom: 12px; }
  .success h2 { color: var(--ok); margin-bottom: 8px; }
  .success p { color: var(--muted); }
</style>
</head>
<body>

<div class="card">
  <div id="form-view">
    <h1>🎉 Приглашаем на выезд!</h1>
    <p class="subtitle">Подтверди участие и расскажи о своих предпочтениях</p>

    <!-- Придёшь? -->
    <div class="section">
      <div class="section-title">Ты с нами?</div>
      <div class="btn-group">
        <button type="button" class="btn yes" data-attend="yes">✅ Буду</button>
        <button type="button" class="btn no" data-attend="no">❌ Не буду</button>
      </div>
    </div>
      <!-- Имя -->
      <div class="section">
        <div class="section-title">Имя</div>
        <input type="text" id="firstName" placeholder="Например: Анастасия">
      </div>

      <!-- Фамилия -->
      <div class="section">
        <div class="section-title">Фамилия</div>
        <input type="text" id="lastName" placeholder="Например: Иванова">
      </div>

      <!-- Группа -->
      <div class="section">
        <div class="section-title">Группа</div>
        <input type="text" id="group" placeholder="Например: ИС-21">
      </div>
    <!-- Детали (показываются только если "Буду") -->
    <div id="details" class="hidden">
      <!-- Количество дней -->
      <div class="section">
        <div class="section-title">На сколько дней?</div>
        <div class="btn-group">
          <button type="button" class="btn day" data-days="1">1 сутки</button>
          <button type="button" class="btn day" data-days="2">2 суток</button>
        </div>
      </div>

      <!-- Игры -->
      <div class="section">
        <div class="section-title">Какие игры можешь взять?</div>
        <input type="text" id="games" placeholder="Например: uno, Бункер, Манчкин...">
      </div>

      <!-- Еда -->
      <div class="section">
        <div class="section-title">Что предпочитаешь из еды? (можно несколько)</div>
        <div class="checkbox-group">
          <label class="checkbox-label"><input type="checkbox" value="Мясо"> 🥩 Мясо</label>
          <label class="checkbox-label"><input type="checkbox" value="Птица"> 🍗 Птица</label>
          <label class="checkbox-label"><input type="checkbox" value="Рыба"> 🐟 Рыба</label>
        </div>
      </div>

      <!-- Комментарий -->
      <div class="section">
        <div class="section-title">Комментарий (необязательно)</div>
        <textarea id="comment" placeholder="Аллергии, пожелания, вопросы..."></textarea>
      </div>
    </div>

    <button type="button" class="submit-btn" id="submit">Отправить ответ</button>
  </div>

  <!-- Экран успеха -->
  <div id="success-view" class="success hidden">
    <div class="icon">🎊</div>
    <h2>Спасибо!</h2>
    <p>Твой ответ сохранён. Увидимся на выезде!</p>
  </div>
</div>

<script>
  // ===== Состояние =====
    const state = {
    attend: null,
    firstName: '',
    lastName: '',
    group: '',
    days: null,
    games: '',
    food: [],
    comment: ''
  };

  // ===== Элементы =====
  const details = document.getElementById('details');
  const submitBtn = document.getElementById('submit');
  const formView = document.getElementById('form-view');
  const successView = document.getElementById('success-view');

  // ===== Кнопки "Буду / Не буду" =====
  document.querySelectorAll('[data-attend]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-attend]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      state.attend = btn.dataset.attend;

      if (state.attend === 'yes') {
        details.classList.remove('hidden');
      } else {
        details.classList.add('hidden');
        // сброс деталей, если передумал
        state.days = null;
        document.querySelectorAll('[data-days]').forEach(b => b.classList.remove('selected'));
      }
    });
  });

  // ===== Кнопки "1 сутки / 2 суток" =====
  document.querySelectorAll('[data-days]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-days]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      state.days = Number(btn.dataset.days);
    });
  });

  // ===== Чекбоксы еды =====
  document.querySelectorAll('.checkbox-label input').forEach(cb => {
    cb.addEventListener('change', () => {
      cb.parentElement.classList.toggle('checked', cb.checked);
      state.food = Array.from(document.querySelectorAll('.checkbox-label input:checked'))
                        .map(i => i.value);
    });
  });

  // ===== Отправка =====
   submitBtn.addEventListener('click', async () => {
    // 1) Считываем поля имени/фамилии/группы ПЕРВЫМИ
    const firstName = document.getElementById('firstName').value.trim();
    const lastName  = document.getElementById('lastName').value.trim();
    const group     = document.getElementById('group').value.trim();

    // 2) Проверяем, что всё заполнено
    if (!firstName || !lastName || !group) {
      alert('Пожалуйста, заполни имя, фамилию и группу');
      // подсветим пустые поля красным
      if (!firstName) document.getElementById('firstName').style.borderColor = '#ef4444';
      if (!lastName)  document.getElementById('lastName').style.borderColor  = '#ef4444';
      if (!group)     document.getElementById('group').style.borderColor     = '#ef4444';
      return; // дальше не идём — форма не отправится
    }
    // сбросим подсветку, если всё ок
    ['firstName','lastName','group'].forEach(id => {
      document.getElementById(id).style.borderColor = '';
    });

    // 3) Проверка участия
    if (!state.attend) {
      alert('Пожалуйста, выбери: будешь ты или нет 🙂');
      return;
    }
    if (state.attend === 'yes' && !state.days) {
      alert('Выбери количество дней: 1 или 2 суток');
      return;
    }

    // 4) Собираем данные в state
    state.firstName = firstName;
    state.lastName  = lastName;
    state.group     = group;
    state.games     = document.getElementById('games').value.trim();
    state.comment   = document.getElementById('comment').value.trim();

    // 5) Отправка
    submitBtn.textContent = 'Отправка...';
    submitBtn.disabled = true;

    try {
      const response = await fetch('https://formspree.io/f/xnppprlr', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(state)
      });

      if (response.ok) {
        formView.classList.add('hidden');
        successView.classList.remove('hidden');
      } else {
        alert('Ошибка отправки. Попробуй ещё раз.');
        submitBtn.textContent = 'Отправить ответ';
        submitBtn.disabled = false;
      }
    } catch (error) {
      alert('Ошибка сети. Проверь интернет.');
      submitBtn.textContent = 'Отправить ответ';
      submitBtn.disabled = false;
    }
  });

      if (response.ok) {
        formView.classList.add('hidden');
        successView.classList.remove('hidden');
      } else {
        alert('Ошибка отправки. Попробуй ещё раз.');
        submitBtn.textContent = 'Отправить ответ';
        submitBtn.disabled = false;
      }
    } catch (error) {
      alert('Ошибка сети. Проверь интернет.');
      submitBtn.textContent = 'Отправить ответ';
      submitBtn.disabled = false;
    }

    // Показать экран успеха
    formView.classList.add('hidden');
    successView.classList.remove('hidden');
  });
</script>
</body>
</html>
